name: Frontend CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  # ========================================================
  # 1. Lint & Build Check (Continuous Integration)
  # ========================================================
  build-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Test Production Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'http://localhost:4000' }}

  # ========================================================
  # 2. Deploy via SSH / Docker (Continuous Deployment)
  # ========================================================
  deploy:
    needs: build-and-lint
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            # Pindah ke direktori project frontend di server
            cd ${{ secrets.VPS_FRONTEND_DIR || '~/insightpoll_fe' }}

            # Tarik kode terbaru
            git pull origin ${{ github.ref_name }}

            # Build dan restart container Docker
            docker compose down
            docker compose up -d --build

            # Bersihkan cache image lama
            docker image prune -f

            echo "🚀 Frontend successfully deployed!"
